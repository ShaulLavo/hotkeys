name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/hotkeys/package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish the npm tarball
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm version
        id: version
        run: |
          version=$(node -p 'require("./packages/hotkeys/package.json").version')
          status=$(curl --retry 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@shaulavo%2fhotkeys/$version")
          case "$status" in
            200) printf 'publish=false\n' >> "$GITHUB_OUTPUT" ;;
            404) printf 'publish=true\n' >> "$GITHUB_OUTPUT" ;;
            *) echo "npm registry returned HTTP $status"; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
          key: hotkeys-bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'patches/*') }}
          restore-keys: hotkeys-bun-${{ runner.os }}-

      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: bun run verify

      - if: steps.version.outputs.publish == 'true'
        run: bunx --no-install playwright install --with-deps --only-shell chromium

      - if: steps.version.outputs.publish == 'true'
        run: bun run test:browser

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: hotkeys-npm-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - name: Publish verified bytes
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          test "$(node -p 'require("./manifest.json").revision')" = "$GITHUB_SHA"
          tarball=$(node -p 'require("./manifest.json").artifacts[0].file')
          npm publish "./$tarball" --access public --provenance
