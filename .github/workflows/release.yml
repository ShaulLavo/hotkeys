name: Release packages

on:
  push:
    tags: ['hotkeys-*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hotkeys-packages
          path: release
      - name: Check release identity and checksums
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          test "$TAG" = "hotkeys-$REVISION"
          node -e 'const m = require("./release/manifest.json"); if (m.revision !== process.env.REVISION || m.tag !== process.env.TAG) process.exit(1)'
          (cd release && sha256sum --check SHA256SUMS)
      - name: Create draft with the verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --draft --title "$TAG" --notes 'Core and React packages for this commit. Review manifest.json and SHA256SUMS before publishing.'
